# /etc/nginx/snippets/dkp-security-headers.conf — server-level headers for dikenocracy.com (2026-11-17).
# Locations that set their own add_header do not inherit these (nginx rule); those locations include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
