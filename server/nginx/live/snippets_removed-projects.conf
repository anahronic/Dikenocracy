# Included in the dikenocracy.com HTTPS server block.
# Ayalon (paused 2026-10-14) and Mazkira were withdrawn from the public site on 2026-11-17
# (PUBLIC_REMOVAL_VERIFICATION_2026-11-17.md). Former public URLs answer 410 Gone with the site's own
# error page, without redirects or server details. Ayalon's app and data stay in /opt/Life;
# its former proxy blocks are in /root/hardening-20261014-050110/ayalon-nginx-locations.conf.
location = /ayalon { error_page 410 /errors/410.html; return 410; }
location ^~ /ayalon/ { error_page 410 /errors/410.html; return 410; }
location = /pages/projects/ayalon.html { error_page 410 /errors/410.html; return 410; }
location ~ ^/assets/covers/(mazkira|ayalon)-[0-9]+\.svg$ { error_page 410 /errors/410.html; return 410; }
