# mazkira.dikenocracy.com — Mazkira was withdrawn from public access on 2026-11-17
# (PUBLIC_REMOVAL_VERIFICATION_2026-11-17.md). Every request gets 410 Gone; nothing is proxied.
# The application (mazkira.service: stopped and disabled), its PostgreSQL database, documents and
# encrypted backups are preserved on the server. The certificate keeps renewing (acme-challenge below),
# so visitors through Cloudflare see the 410 and not a TLS error.
# Previous configuration: /home/admin/backups/public-removal-20261117/etc-nginx-before.tgz
# conf.d/mazkira-limits.conf and snippets/mazkira-proxy.conf, cloudflare-realip.conf are kept, unused here.

server {
    listen 80;
    listen [::]:80;
    server_name mazkira.dikenocracy.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 410 "Gone\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mazkira.dikenocracy.com;

    ssl_certificate     /etc/letsencrypt/live/mazkira.dikenocracy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mazkira.dikenocracy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 410 "Gone\n";
    }
}
