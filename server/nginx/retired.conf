# /etc/nginx/snippets/dkp-retired.conf — included in the dikenocracy.com HTTPS server block (2026-11-17).
# Market Lens was retired from this server on 2026-11-17 (owner decision); its source stays in
# github.com/anahronic/market-lens (branch server-snapshot-2026-11-17). Every /api/ path that no live service owns
# answers 410 Gone with a JSON body. Live APIs keep longer prefixes and win: /api/lab/v1/ (dkp-lab.conf),
# /api/feedback/v1/* (dkp-feedback.conf). The retired Keeper prefixes are answered in dkp-lab.conf.
location /api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/dkp-security-headers.conf;
    return 410 '{"error":{"code":"gone","message":"This API has been retired."}}\n';
}
