# /etc/nginx/snippets/dkp-site-errors.conf — public error pages for dikenocracy.com (2026-11-17).
# Pages live outside the web root (/var/www/dkp-errors/errors/), so the Keeper injector never sees them.
error_page 400 /errors/400.html;
error_page 401 /errors/401.html;
error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 405 /errors/405.html;
error_page 410 /errors/410.html;
error_page 413 /errors/413.html;
error_page 429 /errors/429.html;
error_page 500 /errors/500.html;
error_page 502 /errors/502.html;
error_page 503 /errors/503.html;
error_page 504 /errors/504.html;
location ^~ /errors/ {
    internal;
    root /var/www/dkp-errors;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/dkp-security-headers.conf;
}
