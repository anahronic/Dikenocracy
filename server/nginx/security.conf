# /etc/nginx/conf.d/dkp-security.conf (http context, 2026-11-17)
server_tokens off;                                                        # no nginx version in headers or error pages
limit_req_zone $binary_remote_addr zone=ml_post:5m rate=30r/m;            # Market Lens POST (per visitor after realip)
limit_req_zone $binary_remote_addr zone=ml_get:5m rate=10r/s;
