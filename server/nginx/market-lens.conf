# /etc/nginx/snippets/dkp-market-lens.conf — Market Lens API (127.0.0.1:8000) behind /api/ (2026-11-17).
# Public by design (browser extension); protected here by method, size and per-visitor rate limits. CORS is not auth.
location = /api/v1/ingest {
    limit_except POST { deny all; }
    limit_req zone=ml_post burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    include /etc/nginx/snippets/dkp-api-errors.conf;
    include /etc/nginx/snippets/dkp-market-lens-proxy.conf;
}
location = /api/v1/evaluate {
    limit_except POST { deny all; }
    limit_req zone=ml_post burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    include /etc/nginx/snippets/dkp-api-errors.conf;
    include /etc/nginx/snippets/dkp-market-lens-proxy.conf;
}
location /api/ {
    limit_except GET HEAD { deny all; }
    limit_req zone=ml_get burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    include /etc/nginx/snippets/dkp-api-errors.conf;
    include /etc/nginx/snippets/dkp-market-lens-proxy.conf;
}
