<!doctype html>
<meta charset="utf-8">
<title>asset preview</title>
<style>
  body { font-family: Segoe UI, sans-serif; background: #faf8f4; color: #1f2733; padding: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 24px; }
  .ic { width: 96px; text-align: center; font-size: 12px; }
  .ic span { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 16px; background: #efe9fb; color: #4b3fa8; }
  .ic svg { width: 32px; height: 32px; }
  img { max-width: 600px; background: #fff; border: 1px solid #e4ded3; border-radius: 12px; }
</style>
<div class="row" id="icons"></div>
<img src="/assets/protocol-stack-20261013.svg" alt="">
<script>
  const ids = ['foundation','l0','l1','l2','l3','l4','l5','l6','l7','l8','appendix','measure','rules','open','people','layers','tool','clock','download','github','arrow'];
  document.getElementById('icons').innerHTML = ids.map((i) =>
    `<div class="ic"><span><svg><use href="/assets/icons-20261013.svg#i-${i}"/></svg></span>${i}</div>`).join('');
</script>
