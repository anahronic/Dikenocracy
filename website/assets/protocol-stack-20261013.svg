<g><polygon points="40,68 190,120 190,129 40,77" fill="#7d6fd0"/><polygon points="340,68 190,120 190,129 340,77" fill="#5a4bb5"/><polygon points="40,68 190,16 340,68 190,120" fill="#c9c0f2" stroke="#fff" stroke-width="1.5" opacity=".97"/></g>
<line x1="346" y1="71" x2="374" y2="71" stroke="#5a4bb5" stroke-width="1.5"/>
<text x="382" y="73"><tspan class="k" fill="#5a4bb5">L8</tspan><tspan class="n" dx="8">Infrastructure</tspan></text>
<text class="s" x="190" y="458" text-anchor="middle">a higher layer never overrides a lower one</text>
</svg>
