# /etc/nginx/snippets/dkp-feedback.conf — included in the dikenocracy.com HTTPS server block (2026-11-17).
# Zone `dkp_feedback` is defined in /etc/nginx/conf.d/dkp-feedback-limits.conf.
location = /api/feedback/v1/submit {
    limit_except POST { deny all; }
    limit_req zone=dkp_feedback burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8722;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location = /api/feedback/v1/health {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8722;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}
location ^~ /api/feedback/ { return 404; }
