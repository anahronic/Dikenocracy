name: site
# Checks for the dikenocracy.com sources (2026-11-17). No deployment: releases are deployed by the operator
# (see DEPLOY.md); this workflow produces a release manifest artifact for comparison with production.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Secret scan
        run: python ci/secret_scan.py
      - name: Protocol registry, removed projects, no custom translation, lang/charset
        run: python ci/check_site.py
      - name: Protocol bodies unchanged since the previous commit
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then python website/tools/check_content.py HEAD^; fi
      - name: DTI converter (JS) against ICU, 1900-2100
        run: node website/tools/test_converter_hebrew.mjs 1900 2100
      - name: DTI converter (JS) against the DKP-0-TIME-001 formula
        run: node website/tools/test_converter_dti.mjs
      - name: Converter DTI (Python) and feedback service tests
        run: |
          (cd "Converter DTI" && python -m pytest -q -p no:cacheprovider converter_dti/tests)
          cd services/feedback && python -m pytest -q -p no:cacheprovider test_app.py
      - name: Local links
        run: |
          python -m http.server 8765 --bind 127.0.0.1 -d website >/dev/null 2>&1 &
          sleep 2
          python website/tools/check_links.py http://127.0.0.1:8765
      - name: Release manifest
        run: python ci/release_manifest.py > release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
